# 10분마다 커뮤니티 공식 RSS 수집 → 오늘특가 워커(/api/ingest)로 전달.
# GitHub 예약 실행은 몇 분 늦거나 가끔 빠질 수 있음(정상). 60일간 저장소 변경이 없으면 GitHub가 예약을 멈추니, 그때는 Actions 화면에서 다시 켜기.
name: collect

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Collect and send
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node collect.mjs
