name: diag-thumb
on:
  push:
    branches: [diag-thumb]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: DRY_RUN=1 FEEDS_OUT=feeds.json node collect.mjs
      - run: node diag.mjs > diag-out.txt 2>&1 || true
      - run: |
          git config user.name diag-bot; git config user.email diag@users.noreply.github.com
          git add -f diag-out.txt; git commit -m "diag 결과 [skip ci]" && git push
